<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>

    <!-- Header -->
    <header>
        <h1>Blood Donation Management System</h1>
        <nav>
            <a href="index.html"><i class="fas fa-home"></i> Home</a>
            <a href="register.html"><i class="fas fa-user-plus"></i> Donor Registration</a>
            <a href="search.html"><i class="fas fa-search"></i> search Blood</a>
            <a href="awareness.html"><i class="fas fa-heart"></i> awareness</a>
            <a href="contact.html"><i class="fas fa-envelope"></i> contact</a>
        </nav>
    </header>

    <!-- Contact Section -->
    <section class="contact-section">
        <h2>Contact Us</h2>
        <p>If you have any questions or need help, feel free to contact us.</p>

        <form>
            <label for="a1">Your Name:</label><br>
            <input type="text" placeholder="Enter your name" id="a1"><br><br>

            <label for="a2">Email Address:</label><br>
            <input type="email" placeholder="Enter your email" id="a2"><br><br>

            <label for="a3">Your Message:</label><br>
            <textarea rows="5" placeholder="Write your message" id="a3"></textarea><br><br>

            <button type="submit">Send Message</button>
        </form>

        <div class="contact-info">
            <p><strong>Emergency Helpline:</strong> 0300-XXXXXXX</p>
            <p><strong>Email:</strong> support@blooddonation.com</p>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Blood Donation Management System</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
